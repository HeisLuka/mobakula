[package]
name = "mobakula-mobile-api"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "mobakula_mobile_api"
path = "src/lib.rs"

[dependencies]
aquilum-core = { git = "https://github.com/Lalalalendia/Akula", rev = "195821e10d0d8e87c8ef8af6693ccddf7669a3cf", default-features = false }

serde = { version = "1", features = ["derive"] }
uuid = { version = "1.23.5", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
