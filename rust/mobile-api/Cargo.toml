[package]
name = "mobakula-mobile-api"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "mobakula_mobile_api"
path = "src/lib.rs"

[dependencies]
aquilum-core = { git = "https://github.com/Lalalalendia/Akula", rev = "d4487a78083150924a7a8b8ea85693d931041960", default-features = false }

serde = { version = "1", features = ["derive"] }
uuid = { version = "1.23.5", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
