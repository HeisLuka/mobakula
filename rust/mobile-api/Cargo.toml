[package]
name = "mobakula-mobile-api"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "mobakula_mobile_api"
path = "src/lib.rs"

[dependencies]
aquilum-core = { git = "https://github.com/Lalalalendia/Akula", rev = "58a15187b790ade76b5e70fed9342b789f3623fe", default-features = false, features = ["sync-s3-invite"] }

serde = { version = "1", features = ["derive"] }
uuid = { version = "1.23.5", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
