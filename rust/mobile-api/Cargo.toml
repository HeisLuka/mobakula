[package]
name = "mobakula-mobile-api"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "mobakula_mobile_api"
path = "src/lib.rs"

[dependencies]
aquilum-core = { git = "https://github.com/Lalalalendia/Akula", rev = "f8a562b05fad81ec6bf312fa364aab1013b4dd3f", default-features = false, features = ["sync-s3-invite"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8.5"
ring = "0.17.14"
zeroize = "1.9.0"
uuid = { version = "1.23.5", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
