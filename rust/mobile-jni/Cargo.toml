[package]
name = "mobakula-mobile-jni"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "mobakula_mobile"
crate-type = ["cdylib"]

[dependencies]
mobakula-mobile-api = { path = "../mobile-api" }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.9"
ring = "0.17.14"
blake3 = "1.8.5"
