name: Mobile gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  mobile-gate:
    name: mobile-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout with base history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce repository limits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_BRANCH: ${{ github.head_ref }}
        run: python3 scripts/ci/policy.py
      - name: Run policy regression tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Detect Android changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || ! "${BASE_SHA}" =~ ^[a-f0-9]{40}$ || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            echo "android=true" >> "${GITHUB_OUTPUT}"
          elif git diff --name-only "${BASE_SHA}...HEAD" | grep -Eq '^(android/|\.github/workflows/ci\.yml$|scripts/ci/)'; then
            echo "android=true" >> "${GITHUB_OUTPUT}"
          else
            echo "android=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Set up JDK
        if: steps.scope.outputs.android == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        if: steps.scope.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Set up Android SDK
        if: steps.scope.outputs.android == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 37
        if: steps.scope.outputs.android == 'true'
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Compile debug Android APK
        if: steps.scope.outputs.android == 'true'
        run: gradle --no-daemon -p android :app:assembleDebug :app:testDebugUnitTest
      - name: Upload debug APK
        if: steps.scope.outputs.android == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobakula-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
